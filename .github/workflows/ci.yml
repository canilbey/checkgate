name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e . pytest ruff
      - run: python -m pytest
      - run: python -m ruff check src tests
      - name: Audit this repository's required-check contract
        run: checkgate audit --required test
